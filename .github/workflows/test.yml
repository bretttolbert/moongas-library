name: Run Moongas mediatest Python Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out moongas-go-mediascan
        uses: actions/checkout@v4
        with:
          repository: 'bretttolbert/moongas-go-mediascan'
          path: 'moongas-go-mediascan'

      - name: Check out moongas-py-mediascan
        uses: actions/checkout@v4
        with:
          repository: 'bretttolbert/moongas-py-mediascan'
          path: 'moongas-py-mediascan'

      - name: Check out moongas-py-mediatest
        uses: actions/checkout@v4
        with:
          repository: 'bretttolbert/moongas-py-mediatest'
          path: 'moongas-py-mediatest'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and Install Go Module
        run: |
          cd moongas-go-mediascan
          go install ./...
          # Ensure Go binary path is available in PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # TODO: Run moongas-go-mediascan/cmd/scanartistsyaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Upgrade Pip y
        run: python -m pip install --upgrade pip

      - name: Install Local Python Package mediascan
        run: |
          pip install --force-reinstall -e ./moongas-py-mediascan

      - name: Install Local Python Package mediatest
        run: |
          pip install --force-reinstall -e ./moongas-py-mediatest

      - name: Run mediatest on moongas-libary
        run: python -m mediatest mediatest-config.yml
        working-directory: moongas-py-mediatest
